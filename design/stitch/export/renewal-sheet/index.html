<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
<!-- Mobile Device Simulator Container -->
<div class="relative w-full max-w-[400px] h-[850px] bg-background overflow-hidden border border-white/10 rounded-[40px] shadow-2xl flex flex-col">

<div class="flex items-center gap-4">
<input class="custom-radio appearance-none w-5 h-5 rounded-full border border-outline-variant bg-transparent transition-all" name="plan" type="radio"/>
<div>
<div class="font-body-lg text-body-lg font-medium text-on-surface">Monthly</div>
<div class="font-body-md text-body-md text-on-surface-variant">Full access</div>
</div>
</div>
<div class="font-body-lg text-body-lg font-medium">600 EGP</div>
</label>
<!-- Quarterly Option (Selected) -->
<label class="flex items-center justify-between p-4 rounded-xl border border-primary-container bg-primary-container/5 cursor-pointer">
<div class="flex items-center gap-4">
<input checked="" class="custom-radio appearance-none w-5 h-5 rounded-full border border-primary-container bg-transparent transition-all" name="plan" type="radio"/>
<div>
<div class="flex items-center gap-2">
<span class="font-body-lg text-body-lg font-medium text-on-surface">Quarterly</span>

</div>
<div class="font-body-md text-body-md text-on-surface-variant">Full access</div>
</div>
</div>
<div class="font-body-lg text-body-lg font-medium">1,650 EGP</div>
</label>
<!-- Annual Option -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface cursor-pointer hover:bg-white/5 transition-colors">

<div>
<div class="font-body-lg text-body-lg font-medium text-on-surface">Annual</div>
<div class="font-body-md text-body-md text-on-surface-variant">Full access + 2 guest passes</div>
</div>
</div>
<div class="font-body-lg text-body-lg font-medium">5,800 EGP</div>

<button class="px-4 py-2 rounded-lg border border-primary-container bg-primary-container/10 font-body-md text-body-md text-primary-container">

<span class="material-symbols-outlined text-[18px]" data-icon="smartphone">smartphone</span>
