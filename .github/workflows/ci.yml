name: CI

on:
  pull_request:
  # `main` only. `hardening/**` used to be here and now matches nothing -- branches are named
  # `feat/**`, `fix/**` and `test/**` per feature. Adding those patterns instead would run the
  # whole matrix twice for any branch that also has a PR open, and the PR run is the one that
  # gates a merge; a branch with no PR gets its coverage when one is opened.
  push:
    branches:
      - main

# A second push to the same PR/branch supersedes the last run rather than queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Verify Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  jvm:
    name: Build, test and layering (JVM)
    needs: wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Apple targets silently skip on a Linux host -- that's why the `apple` job below exists
      # and runs on macOS. `check` here covers every JVM/Android test, ktlint/Spotless and the
      # anfas.layering rules; assembleStage additionally proves the R8-minified, debuggable
      # build type -- the only one instrumented tests can run against -- actually assembles.
      - run: ./gradlew check :androidApp:assembleStage

  apple:
    name: Kotlin/Native tests + release framework (Apple)
    needs: wrapper
    # macos-26, not macos-15. Compose Multiplatform 1.11.1's UIKit layer references iOS 26 SDK
    # symbols (`UIViewLayoutRegion`, the `UIUtilities` framework), so linking against the
    # macos-15 image's Xcode 16.4 fails with "Undefined symbols for architecture arm64" out of
    # `CMPLayoutRegion.o` -- which is what the first real CI run did. Local dev is on Xcode 26.6,
    # which is why this only ever failed on the runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the newest Xcode and record it
        # Printed rather than assumed: if a future image drops back below the SDK CMP needs, the
        # log says so in one line instead of 800 lines of linker errors.
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator || true
      # macOS runners have far less RAM than a dev machine. Override in $GRADLE_USER_HOME, not
      # the project's gradle.properties -- release framework linking for two iOS targets needs
      # org.gradle.jvmargs=-Xmx8192M locally, and lowering that project-wide would break local
      # builds. Deliberately not setting org.gradle.parallel: parallel execution plus
      # Kotlin/Native linking inside one daemon is how a constrained runner OOMs.
      - name: Lower the Gradle daemon heap for this runner
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx5120M -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"
      - run: ./gradlew iosSimulatorArm64Test linkReleaseFrameworkIosArm64

  ios-app:
    name: Xcode build (catches pbxproj/xcconfig breakage Gradle can't see)
    needs: wrapper
    # Same iOS 26 SDK requirement as the `apple` job -- this one links the framework too, via
    # the project's embedAndSignAppleFrameworkForXcode build phase.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the newest Xcode and record it
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: xcodebuild
        working-directory: app/iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  android-instrumented:
    name: R8 smoke tests on an emulator (Android)
    needs: wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The emulator is unusably slow without hardware acceleration. GitHub's ubuntu runners do
      # expose /dev/kvm, but not to the runner user, so this rule is required rather than an
      # optimisation -- without it the job either crawls or times out.
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # google_atd: an Automated Test Device image, stripped of the apps and services a CI run
      # will never touch, so it boots far faster than a full one. The Google APIs variant rather
      # than aosp_atd so nothing rests on my reading of whether ML Kit needs Play Services --
      # `com.google.mlkit:text-recognition` is the bundled model and should not, but the app
      # initialises ML Kit through Firebase's ComponentDiscovery at startup, which is precisely
      # the path these tests exist to check, so this is the wrong place to be economical.
      #
      # API 35, not 36 or the 37 this was developed against: what is under test is what R8 left
      # behind, which is identical on every level above minSdk 24, so the well-trodden image is
      # worth more here than the newest one.
      #
      # Note there is deliberately NO `-Pandroid.injected.build.abi` flag. Locally that is set to
      # arm64-v8a to fit a nearly-full emulator disk; passing it here would strip the x86_64
      # libraries this runner actually needs, and the failure would look like a shrinking bug.
      - name: connectedStageAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew :androidApp:connectedStageAndroidTest
