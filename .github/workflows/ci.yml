name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

# A second push to the same PR/branch supersedes the last run rather than queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Verify Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  jvm:
    name: Build, test and layering (JVM)
    needs: wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Apple targets silently skip on a Linux host -- that's why the `apple` job below exists
      # and runs on macOS. `check` here covers every JVM/Android test, ktlint/Spotless and the
      # anfas.layering rules; assembleStage additionally proves the R8-minified, debuggable
      # build type -- the only one instrumented tests can run against -- actually assembles.
      - run: ./gradlew check :androidApp:assembleStage

  apple:
    name: Kotlin/Native tests + release framework (Apple)
    needs: wrapper
    # macos-26, not macos-15. Compose Multiplatform 1.11.1's UIKit layer references iOS 26 SDK
    # symbols (`UIViewLayoutRegion`, the `UIUtilities` framework), so linking against the
    # macos-15 image's Xcode 16.4 fails with "Undefined symbols for architecture arm64" out of
    # `CMPLayoutRegion.o` -- which is what the first real CI run did. Local dev is on Xcode 26.6,
    # which is why this only ever failed on the runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the newest Xcode and record it
        # Printed rather than assumed: if a future image drops back below the SDK CMP needs, the
        # log says so in one line instead of 800 lines of linker errors.
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator || true
      # macOS runners have far less RAM than a dev machine. Override in $GRADLE_USER_HOME, not
      # the project's gradle.properties -- release framework linking for two iOS targets needs
      # org.gradle.jvmargs=-Xmx8192M locally, and lowering that project-wide would break local
      # builds. Deliberately not setting org.gradle.parallel: parallel execution plus
      # Kotlin/Native linking inside one daemon is how a constrained runner OOMs.
      - name: Lower the Gradle daemon heap for this runner
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx5120M -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"
      - run: ./gradlew iosSimulatorArm64Test linkReleaseFrameworkIosArm64

  ios-app:
    name: Xcode build (catches pbxproj/xcconfig breakage Gradle can't see)
    needs: wrapper
    # Same iOS 26 SDK requirement as the `apple` job -- this one links the framework too, via
    # the project's embedAndSignAppleFrameworkForXcode build phase.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the newest Xcode and record it
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: xcodebuild
        working-directory: app/iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
