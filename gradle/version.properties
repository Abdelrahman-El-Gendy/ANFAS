# Single source of truth for the app version on all three platforms.
#
# versionName feeds Android's versionName, iOS MARKETING_VERSION and the desktop
# nativeDistributions packageVersion. It must be semver MAJOR.MINOR.PATCH with MAJOR > 0 --
# jpackage rejects anything else, which is why "1.0" is not acceptable here even though
# Android alone would tolerate it.
versionName=1.0.0

# Monotonic build number. Android versionCode and iOS CURRENT_PROJECT_VERSION share it.
# CI bumps this; it never decreases.
versionCode=1
