[versions]
# --- Build tooling ---------------------------------------------------------
# AGP is capped by the IDE, not by what is newest. Android Studio 2026.1 supports AGP
# 7.1-9.2; going above that ceiling stops the IDE syncing, which breaks run configurations
# and leaves them pointing at stale modules. Raise this only together with Android Studio.
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
jvmToolchain = "17"

# Formatting gate. ktlint is the engine; Spotless is the Gradle integration and also
# covers .kts, res/ XML and Markdown. Resolved from Maven Central, not guessed.
spotless = "8.10.0"
ktlint = "1.8.0"
kotlin = "2.4.10"
# KSP is versioned INDEPENDENTLY of Kotlin since 2.3.0 — there is no "2.4.10-x.y.z".
# The Kotlin 2.4.10 docs pair with 2.3.10; 2.3.11 is the newest release.
ksp = "2.3.11"

# --- UI -------------------------------------------------------------------
composeMultiplatform = "1.11.1"
# material3 for Compose Multiplatform is versioned separately from the rest of
# Compose MP. 1.11.0-alpha07 is the NEWEST release in the 1.11 line — there is
# no stable. Bump only when a 1.11.x stable or 1.12 line appears.
composeMaterial3 = "1.11.0-alpha07"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
# 1.19.0 requires AGP 9.1 / compileSdk 37 and fails checkAarMetadata on our AGP 9.0.1 ceiling —
# the same constraint as androidx-lifecycle below. Raise both only with Android Studio.
androidx-core = "1.18.0"
# 2.11.0 is stable but requires AGP 9.1+ and compileSdk 37. 2.10.0 is the newest stable
# that works with AGP 9.0.1 / compileSdk 36 — bump together with agp above.
androidx-lifecycle = "2.10.0"
coil = "3.5.0"
decompose = "3.5.0"
essenty = "2.5.0"

# --- Data / platform ------------------------------------------------------
# Room's Kotlin Multiplatform line is androidx.room3 (imports androidx.room3.*,
# plugin id "androidx.room3"). The androidx.room 2.8.x coordinates are the
# Android-first line — do NOT mix them.
room3 = "3.0.1"
sqlite = "2.7.0"
ktor = "3.5.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
multiplatformSettings = "1.3.0"

# --- Infrastructure -------------------------------------------------------
koin = "4.2.2"
# ML Kit text recognition, bundled (not the Play-Services-delivered variant): intake has to
# work on a gym floor with no network and no Play module download.
mlkitTextRecognition = "16.0.1"
kermit = "2.1.0"
logback = "1.6.3"

# --- Test -----------------------------------------------------------------
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
androidx-espresso = "3.7.0"
androidx-testExt = "1.3.0"

[libraries]
# --- Gradle plugin jars, for build-logic/ convention plugins ONLY ----------
# These are consumed as `implementation` deps of the convention plugin project
# so it can reference AGP/KGP/Compose/KSP/Room extension types at compile time.
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-kotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
# The io.ktor.plugin marker resolves to io.ktor.plugin:plugin (gradlePluginPortal).
gradlePlugin-ktor = { module = "io.ktor.plugin:plugin", version.ref = "ktor" }
gradlePlugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-composeMultiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
gradlePlugin-ksp = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
gradlePlugin-room3 = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }
gradlePlugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# --- Compose Multiplatform ------------------------------------------------
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# --- Lifecycle (JetBrains multiplatform port) -----------------------------
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# --- Android-only ---------------------------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

# --- kotlinx --------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# --- Room KMP (androidx.room3) + SQLite -----------------------------------
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room3-sqliteWrapper = { module = "androidx.room3:room3-sqlite-wrapper", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# --- Ktor client ----------------------------------------------------------
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Engines are per-platform and must NOT be bundled into commonMain.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# --- Ktor server ----------------------------------------------------------
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# --- Koin -----------------------------------------------------------------
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
mlkit-textRecognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Decompose (navigation) ----------------------------------------------
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensionsCompose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
essenty-lifecycle = { module = "com.arkivanov.essenty:lifecycle", version.ref = "essenty" }
essenty-lifecycleCoroutines = { module = "com.arkivanov.essenty:lifecycle-coroutines", version.ref = "essenty" }

# --- Coil 3 ---------------------------------------------------------------
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-networkKtor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# --- Settings / logging ---------------------------------------------------
multiplatformSettings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatformSettings-noArg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatformSettings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# --- Test -----------------------------------------------------------------
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

[bundles]
compose = [
    "compose-runtime",
    "compose-foundation",
    "compose-ui",
    "compose-material3",
    "compose-components-resources",
    "compose-uiToolingPreview",
]
compose-lifecycle = [
    "androidx-lifecycle-viewmodelCompose",
    "androidx-lifecycle-runtimeCompose",
]
kotlinx = [
    "kotlinx-coroutines-core",
    "kotlinx-serialization-json",
    "kotlinx-datetime",
]
# Engine-agnostic. Each platform source set adds its own engine on top.
ktor-client = [
    "ktor-client-core",
    "ktor-client-contentNegotiation",
    "ktor-client-logging",
    "ktor-serialization-json",
]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-contentNegotiation",
    "ktor-server-auth",
    "ktor-server-statusPages",
    "ktor-server-callLogging",
    "ktor-serialization-json",
]
koin = ["koin-core"]
koin-compose = ["koin-compose", "koin-composeViewmodel"]
room = ["androidx-room3-runtime", "androidx-sqlite-bundled"]
decompose = ["decompose", "decompose-extensionsCompose", "essenty-lifecycleCoroutines"]
coil = ["coil-compose", "coil-networkKtor3"]
settings = ["multiplatformSettings", "multiplatformSettings-coroutines"]
test-common = ["kotlin-test", "turbine", "koin-test", "kotlinx-coroutines-test"]
test-jvm = ["kotlin-testJunit", "mockk"]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
