#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# Kotlin/Native runs the compiler IN the Gradle daemon process, so release framework linking
# (whole-program optimisation, two targets potentially in flight during `./gradlew build`)
# is bounded by org.gradle.jvmargs — not kotlin.daemon.jvmargs. The wizard default of 4g
# OOMs once the app shell pulls in Compose plus seven feature modules.
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
